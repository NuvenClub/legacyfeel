// Base CC0 do Fabric Example Mod; somente preparação de fontes para reconhecimento.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
base { archivesName = 'legacyfeel' }
loom {
    splitEnvironmentSourceSets()
    mods {
        legacyfeel {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
if (project.minecraft_version == '26.3') {
    sourceSets.client.java.exclude 'br/club/nuven/legacyfeel/mixin/MinecraftMixin26_2.java'
    sourceSets.client.java.srcDir 'src/client26_3/java'
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}
processClientResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version
    }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    from('../LICENSE') { rename { "LICENSE_legacyfeel" } }
}
